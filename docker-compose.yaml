services:
  database:
    image: postgres:17.4
    restart: always
    environment:
      POSTGRES_USER: emt
      POSTGRES_PASSWORD: emt
      POSTGRES_DB: emt_lab_ps
    volumes:
      - postgres_db_data:/var/lib/postgresql/data
      - "./init.sql:/docker-entrypoint-initdb.d/init.sql"
      - "./views.sql:/docker-entrypoint-initdb.d/views.sql"
    ports:
      - "2345:5432"


volumes:
  postgres_db_data: