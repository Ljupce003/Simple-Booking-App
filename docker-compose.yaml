services:
  database:
    image: postgres:17.4
    restart: always
    environment:
      POSTGRES_USER: emt
      POSTGRES_PASSWORD: emt
      POSTGRES_DB: emt_lab_ps
    volumes:
      - postgres_db_data:/var/lib/postgresql/data
      - "./backend/init.sql:/docker-entrypoint-initdb.d/init.sql"
      - "./backend/views.sql:/docker-entrypoint-initdb.d/views.sql"
    ports:
      - "2345:5432"

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U emt -d emt_lab_ps" ]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - app-network

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/emt_lab_ps
      SPRING_DATASOURCE_USERNAME: emt
      SPRING_DATASOURCE_PASSWORD: emt
    depends_on:
      database:
        condition: service_healthy # Waits for health check
    networks:
      - app-network

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge


volumes:
  postgres_db_data: