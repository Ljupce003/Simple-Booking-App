
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:2345/emt_lab_ps?useUnicode=true&characterEncoding=UTF-8&serverTimezone=CET}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:emt}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:emt}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true

