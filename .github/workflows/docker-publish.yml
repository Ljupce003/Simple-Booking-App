name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+'

jobs:
  build-and-push-frontend:
    runs-on: ubuntu-24.04
    environment: GITHUB_ACTIONS_DOCKER_ENV
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

#        This is for extracting metadata that here i will use for the tagging
      - name: Docker metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}

  build-and-push-backend:
    runs-on: ubuntu-24.04
    environment: GITHUB_ACTIONS_DOCKER_ENV
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

#        This is for extracting metadata that here i will use for the tagging
      - name: Docker metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}

  deploy-to-cloud:
    needs: [ build-and-push-frontend, build-and-push-backend ]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Fetch latest images from DockerHub
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/backend:latest
            
            # 2. Restart the containers with the new images
            docker-compose -f ~/Simple-Booking-App/docker-compose.yml up -d
            
            # 3. Clean out the old images
            docker image prune -f